name: WP trunk canary

# Shared MHM test floor, item 4 (2026-11-04): a weekly run of the integration
# suite against WordPress trunk, so a core change that breaks this plugin is
# seen here before it ships to shops in the next release.
#
# 🔴 Three properties are the point of this file. Do not "tidy" them away:
#
#  1. Schedule + manual dispatch ONLY. Trunk moves under every commit; on a
#     pull request a red canary would block work for a defect that is not in
#     the change being reviewed.
#  2. NO `continue-on-error`. At job level that flag reports the run as
#     `success`, and GitHub sends no failure email for a successful run, so a
#     canary carrying it can never be heard. A red canary is the message.
#  3. The installed core is verified to BE trunk: bin/install-wp-tests.sh
#     fails unless wp-includes/version.php carries a pre-release suffix. A
#     trunk download that resolved to a release would otherwise pass while
#     testing nothing new.
#
# Known silent stop: GitHub disables scheduled workflows in a repository with
# no activity for 60 days. The run history going quiet is the symptom; re-enable
# under Actions → "WP trunk canary".

on:
  schedule:
    # Mondays 05:17 UTC -- off the hour, when scheduled runs queue less.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trunk:
    name: Integration (PHP 8.4 / WP trunk / WC latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          tools: composer:v2
          coverage: none

      - name: Install SVN (required by install-wp-tests.sh)
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install WordPress trunk test library + WooCommerce
        env:
          WC_VERSION: latest
          WP_CORE_DIR: /tmp/wordpress
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 trunk

      - name: Loading-context gate (admin-only core functions)
        env:
          WP_CORE_DIR: /tmp/wordpress
        run: php bin/check-admin-only-functions.php

      - name: Run PHPUnit (integration)
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: composer test:integration

  # Alarm + clear copied from Rentiva Pro's wp-trunk.yml (Pro #147, 2026-11-19):
  # without them a red scheduled canary only mails whoever last edited the cron
  # line, and Pro #133 sat red for two weeks unnoticed.
  trunk-alarm:
    name: Report a red trunk canary
    needs: [ trunk ]
    if: ${{ failure() && github.event_name == 'schedule' }}
    # GitHub-hosted on purpose, like Pro's nightly-alarm: it calls gh (not in the
    # self-hosted image) and must raise the alarm when the dev machine is off.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the trunk canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="WordPress trunk canary is red"
          body="The weekly run against WordPress trunk failed: ${RUN_URL}

          Read the run first: if the job never started (it waits up to 24 hours for the self-hosted runner, so a dev machine that was off reads as a failure), just re-run it. Otherwise something in the next WordPress release (or the newest WooCommerce / Elementor) breaks Currency Switcher's suite. Close this issue once a canary run is green again."
          existing="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty' || true)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            url="$(gh issue create --title "${title}" --body "${body}")"
            gh issue edit "${url}" --add-assignee "${OWNER}" || true
          fi

  trunk-clear:
    name: Close the trunk canary issue when green
    # 2026-11-19: the alarm opened/commented the issue on red but nothing closed it on green
    # (Pro #95 stayed open three green nights). Self-hosted with curl+jq on purpose: gh is not in
    # the image, and a job on every green night would cost GitHub minutes for nothing.
    needs: [ trunk ]
    if: ${{ success() && github.event_name == 'schedule' }}
    runs-on: ${{ vars.MHM_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close the trunk canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="WordPress trunk canary is red"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          # A failed lookup must not turn a green run red: nothing to close is fine.
          nums="$(curl -fsS "${auth[@]}" "${API}/issues?state=open&per_page=100"             | jq -r --arg t "$title" '.[] | select(.pull_request | not) | select(.title == $t) | .number' || true)"
          for n in $nums; do
            curl -fsS "${auth[@]}" -X POST "${API}/issues/${n}/comments"               -d "$(jq -n --arg b "Green again: ${RUN_URL} -- closed by the workflow." '{body: $b}')" >/dev/null || true
            curl -fsS "${auth[@]}" -X PATCH "${API}/issues/${n}" -d '{"state":"closed","state_reason":"completed"}' >/dev/null               && echo "closed #${n}" || echo "could not close #${n}"
          done
          [ -n "$nums" ] || echo "no open '${title}' issue"
