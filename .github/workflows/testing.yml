name: Testing

on:
  pull_request:
    branches: [ master, develop ]
  push:
    branches: [ master, develop ]

concurrency:
  group: testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: |
            vendor
            ~/.composer/cache/files
          key: ${{ runner.os }}-php-8.2-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPCS
        run: composer lint

      - name: WP.org compliance gate (no licence surface)
        run: bin/check-no-license-refs.sh

  phpunit:
    name: PHPUnit unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # PHP versions only. This job runs the stub-based unit suite, which
        # never loads WordPress — so declaring a `wp` dimension here would be
        # decorative. It used to be exactly that: the matrix advertised
        # WP 6.0/6.4/latest while installing no WordPress at all, which is
        # how a shortcode signature that fatals on every WordPress below 6.5
        # shipped with a green "WP 6.0" tick. Real WordPress coverage now
        # lives in the `integration` job below.
        php: ['7.4', '8.1', '8.2', '8.3']

    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: |
            vendor
            ~/.composer/cache/files
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit (unit)
        run: composer test

  integration:
    name: Integration (PHP ${{ matrix.php }} / WP ${{ matrix.wp }} / WC ${{ matrix.wc }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # WordPress and WooCommerce versions must be pinned as PAIRS. Current
        # WooCommerce requires WP 6.5+ (it calls wp_register_script_module),
        # so "every WP version × latest WC" is not installable. Every triple
        # below was verified end-to-end locally via
        # bin/test-integration-docker.sh before being added here.
        #
        # `wc: latest` means the latest RELEASED WooCommerce, not trunk —
        # see install_woocommerce() in bin/install-wp-tests.sh for why that
        # distinction cost us a job that silently tested a release candidate.
        # Read the resolved version off the "[install-wp-tests] resolved: WC"
        # line in this job's log; that number is what readme.txt's
        # "WC tested up to" is allowed to claim.
        # The floor moved 6.0 -> 6.6 in v1.1.2 and this matrix moved with it.
        # The admin bundle depends on the `react-jsx-runtime` script handle,
        # which WordPress core only registers from 6.6; below that the handle
        # is unregistered, so wp_enqueue_script drops the admin app silently
        # and the settings screen is an empty div. Testing 6.0 after raising
        # the floor would have covered a version we no longer claim while
        # leaving the version we DO claim untested.
        include:
          - php: '7.4'
            wp: '6.6'
            wc: '9.1.4'
          - php: '8.1'
            wp: '6.8'
            wc: '9.8.5'
          - php: '8.2'
            wp: 'latest'
            wc: 'latest'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer:v2
          coverage: none

      - name: Install SVN (required by install-wp-tests.sh)
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: |
            vendor
            ~/.composer/cache/files
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # WP_CORE_DIR is pinned rather than left to the script's ${TMPDIR:-/tmp}
      # default because the loading-context gate below reads the same path.
      # Left implicit, the two agree only as long as the runner never sets
      # TMPDIR, and the day it does the gate finds no core, fails closed, and
      # the failure reads as a code defect instead of a path drift.
      - name: Install WordPress test library + WooCommerce
        env:
          WC_VERSION: ${{ matrix.wc }}
          WP_CORE_DIR: /tmp/wordpress
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }}

      # Runs once per matrix entry ON PURPOSE. The admin-only inventory is
      # derived from the core tree, so it differs between WordPress versions:
      # a function that moves out of wp-admin/includes in a later release stops
      # being admin-only, and one that moves IN starts being a fatal on every
      # REST, cron and CLI path. A single-version run would answer for one
      # WordPress and imply all three.
      #
      # The gate fails closed when it cannot find a core tree, which is the
      # failure this step is most likely to hit. Read its own summary line
      # ("Core: ... admin-only: N", plus the canary line) in the log rather
      # than trusting the exit code alone: a gate that measured nothing and
      # exited 0 is the exact shape being guarded against here.
      - name: Loading-context gate (admin-only core functions)
        env:
          WP_CORE_DIR: /tmp/wordpress
        run: php bin/check-admin-only-functions.php

      - name: Run PHPUnit (integration)
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: composer test:integration

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: |
            vendor
            ~/.composer/cache/files
          key: ${{ runner.os }}-php-8.2-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: composer analyze

  jest:
    name: Front-end JS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # assets/js is the plugin's flagship surface and had no gate at all: both
      # JS defects this release shipped — the cookie the prefix rename missed,
      # and the markers a hydrating block replaced — were caught by a person
      # looking at a browser, once each, by luck.
      - name: Run Jest
        run: npm run test:js

      # `npm run lint:js` existed but nothing ran it, so it rotted to 11 errors
      # across three files without anyone noticing — including a real
      # accessibility defect (a <label> tied to no control, so screen readers
      # announced the currency picker as an unlabelled button). A script no CI
      # job calls is not a gate. This job is what stops it rotting again.
      - name: Run ESLint
        run: npm run lint:js

      # The ZIP ships admin-app/build/, never admin-app/src/ — .distignore
      # excludes the sources. But every gate that reads the admin app reads the
      # SOURCE: HelpTabAccuracyTest parses HowToUse.jsx, ESLint lints src/. So a
      # committed bundle that no longer matches its source would sail through
      # every check while the ZIP carried stale UI and stale documentation, and
      # the help tab's whole promise is that its documentation cannot drift.
      # Rebuilding and diffing is the only thing that ties the shipped artefact
      # to the code the other gates actually inspect.
      - name: Built admin bundle matches its source
        run: |
          npm run build
          git diff --exit-code --stat -- admin-app/build \
            || { echo "::error::admin-app/build is out of date. Run 'npm run build' and commit the result."; exit 1; }
