# Development stack for MHM Currency Switcher.
#
# The plugin is also bind-mounted into the rentiva-dev stack (wp-env
# "Kategori 2"), but that site runs MHM Rentiva, Rentiva Pro, Elementor and a
# dozen other plugins — a noisy place to judge whether a currency switcher
# behaves correctly. This stack is CS on its own, with WooCommerce and seeded
# products, so browser verification is one command instead of hand-copying
# files into a shared site.
#
# This is NOT the test environment. Integration tests run in disposable
# containers via bin/test-integration-docker.sh, mirroring CI across several
# WP x WC version pairs. This stack is the opposite: one persistent, seeded
# site you can open in a browser.
#
# Ports follow the ecosystem convention documented in credentials.md.
#
# The project name is set explicitly: Compose otherwise derives it from the
# directory, and this file lives in `docker/`, which would produce useless
# container names like `docker-wordpress-1` that also collide with any other
# project having a `docker/` folder. Every stack in this ecosystem is named
# after its project (rentiva-dev-wordpress-1, ...); this one matches.
name: mhmcs-dev

services:
  db:
    image: mysql:8.0
    ports:
      - "${DB_PORT}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - mhmcs-net

  wordpress:
    image: wordpress:php8.2-apache
    # Izin + tazelik deseni (2026-09-06, Fable denetimi sonrasi tek desen):
    #  - exec => Apache PID 1 kalir: SIGTERM zarif kapanir, cikis kodu gercek
    #  - entrypoint kendi argumanini gorur => BOS volume'da cekirdek kopyalanir
    #  - chown arka planda: wp-content + koktekiler (wp-config.php dahil)
    command: >
      bash -c '
        ( until [ -f /var/www/html/wp-load.php ]; do sleep 1; done;
          find /var/www/html -maxdepth 1 -user root -exec chown www-data:www-data {} + 2>/dev/null || true;
          chown -R www-data:www-data /var/www/html/wp-content 2>/dev/null || true
        ) &
        exec docker-entrypoint.sh apache2-foreground
      '
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mhmcs.rule=Host(`currency.localhost`)"
      - "traefik.http.routers.mhmcs.entrypoints=web"
      - "traefik.http.services.mhmcs.loadbalancer.server.port=80"
    ports:
      - "${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DEBUG: 1
      MAILPIT_HOST: mailpit
      MAILPIT_PORT: 1025
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        if (isset($$_SERVER['HTTP_HOST']) && !empty($$_SERVER['HTTP_HOST'])) {
            if (!defined('WP_HOME'))    define('WP_HOME',    'http://' . $$_SERVER['HTTP_HOST']);
            if (!defined('WP_SITEURL')) define('WP_SITEURL', 'http://' . $$_SERVER['HTTP_HOST']);
        }
    volumes:
      - wpdata:/var/www/html
      # The repo root IS the plugin, so it mounts straight into place.
      - ../:/var/www/html/wp-content/plugins/mhm-currency-switcher
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
    networks:
      - mhmcs-net
      - traefik-proxy

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      - db
      - wordpress
    user: "33:33"
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      MAILPIT_HOST: mailpit
      MAILPIT_PORT: 1025
    volumes:
      - wpdata:/var/www/html
      - ../:/var/www/html/wp-content/plugins/mhm-currency-switcher
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    entrypoint: ["tail", "-f", "/dev/null"]
    networks:
      - mhmcs-net

  phpmyadmin:
    image: phpmyadmin
    depends_on:
      - db
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 128M
    ports:
      - "${PMA_PORT}:80"
    networks:
      - mhmcs-net

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_PORT}:8025"
    networks:
      - mhmcs-net

volumes:
  wpdata:
  dbdata:

networks:
  mhmcs-net:
    name: mhmcs-net
  traefik-proxy:
    external: true
    name: traefik-proxy
